version: '3.8'

volumes:
  postgres_test_data:

networks:
  nfretes_test_network:
    driver: bridge

services:
  postgres-test:
    image: postgres:14-alpine
    container_name: nfretes_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: nfretes_test_db
      POSTGRES_USER: nfretes_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-test123456}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nfretes_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfretes_test -d nfretes_test_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: nfretes_backend_test
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres-test
      DATABASE_PORT: 5432
      DATABASE_NAME: nfretes_test_db
      DATABASE_USERNAME: nfretes_test
      DATABASE_PASSWORD: ${POSTGRES_TEST_PASSWORD:-test123456}
      JWT_SECRET: ${JWT_SECRET:-test_jwt_key_for_development}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - nfretes_test_network
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
    command: ["yarn", "start:dev"]